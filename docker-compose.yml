version: '3.8'

# WHY DOCKER COMPOSE:
# Docker Compose lets us define and run multi-container applications.
# While we only have one API container now, in a real system we'd add 
# Redis (for caching), PostgreSQL (for transaction logs), and Prometheus (for metrics).
# Compose makes spinning up the whole stack a one-liner: `docker-compose up -d`

services:
  fraud-detection-api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: fraud_api
    ports:
      # Map host port 8000 to container port 8000
      - "8000:8000"
    volumes:
      # WHY VOLUMES:
      # We map the host's models/ and logs/ directories into the container.
      # This allows us to update the ML models on the host without rebuilding the image,
      # and ensures prediction logs generated by the container are saved to the host.
      - ./models:/app/models
      - ./logs:/app/logs
    environment:
      # Pass environment variables to the container
      - ENV=production
      - LOG_LEVEL=info
    restart: unless-stopped
    # MENTOR NOTE: Healthchecks tell orchestrators if the app is actually ready to serve traffic,
    # not just if the process is running.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
